# Application name
spring.application.name=job-application-portal

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/jobportal_db
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Disable Thymeleaf cache during development
spring.thymeleaf.cache=false

# Server port
server.port=8080

# Resume uploads
app.upload.dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Keep browser error responses user-friendly
server.error.include-stacktrace=never
server.error.include-exception=false
